  <body>
    <div class="card">
      <h1>Jovee Link</h1>
      <p id="desc">Opening post...</p>
      <a id="openAppBtn" class="btn primary" href="#">Open in app</a>
      <a id="iosBtn" class="btn secondary" href="https://apps.apple.com/us/app/jovee-link/id6755535426">Download on App Store</a>
      <a id="androidBtn" class="btn secondary" href="https://play.google.com/store/apps/details?id=com.joveelink.app">Get it on Google Play</a>
      <a class="btn secondary" href="https://www.joveelink.com/">Back to website</a>
      <p class="muted">If the app does not open automatically, use the download buttons above.</p>
    </div>

    <script>
      (function () {
        var parts = window.location.pathname.split("/").filter(Boolean);
        // /community/post/<id>  ->  parts = ["community","post","<id>"]
        var pathPostId = parts[0] === "community" && parts[1] === "post" ? parts[2] : null;
        var queryPostId = new URLSearchParams(window.location.search).get("postId");
        var postId = queryPostId || pathPostId;

        var deepLink = postId
          ? "joveelinkmobile://community/post/" + encodeURIComponent(postId)
          : "joveelinkmobile://";

        var desc = document.getElementById("desc");
        var openBtn = document.getElementById("openAppBtn");
        openBtn.href = deepLink;
        desc.textContent = postId ? "Opening this post in the Jovee Link app..." : "Opening Jovee Link app...";

        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var isAndroid = /Android/i.test(ua);

        if (!isIOS) document.getElementById("iosBtn").style.display = "none";
        if (!isAndroid) document.getElementById("androidBtn").style.display = "none";

        var start = Date.now();
        window.location.href = deepLink;

        setTimeout(function () {
          if (Date.now() - start < 1400) return;
          if (isIOS) {
            window.location.href = "https://apps.apple.com/us/app/jovee-link/id6755535426";
          } else if (isAndroid) {
            window.location.href = "https://play.google.com/store/apps/details?id=com.joveelink.app";
          }
        }, 1200);
      })();
    </script>
  </body>
